[package]
name = "lavi"
version = "0.4.0"
edition = "2021"
license = "MIT"
description = "A portable, #![no_std] statechart runtime compatible with the XState v5 specification and JSON format."
repository = "https://github.com/emmby/lavi"
homepage = "https://emmby.github.io/lavi/examples/"
documentation = "https://docs.rs/lavi"
readme = "README.md"
keywords = ["statechart", "xstate", "fsm", "state-machine", "no-std"]
categories = ["no-std", "embedded", "simulation", "algorithms"]
include = ["src/**/*", "Cargo.toml", "README.md", "LICENSE"]

[dependencies]
# We don't want to have any dependencies in this package, except basic data structures
indexmap = { version = "2.7", default-features = false }
